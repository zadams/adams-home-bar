<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a2e24" />
    <title>Offline — The Adams Home Bar</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Georgia, 'Times New Roman', serif;
        background: #1a1510;
        color: #f3ead7;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-weight: 600;
        font-size: 2rem;
        margin: 0 0 0.75rem;
      }
      p {
        font-family: system-ui, sans-serif;
        color: #b8a890;
        max-width: 28rem;
        line-height: 1.5;
      }
      a {
        color: #d4b483;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>You’re offline</h1>
      <p>
        The Adams Home Bar couldn’t reach the network. If you’ve opened the app
        before, go back and try a cached page — or reconnect and reload.
      </p>
      <p><a href="/">Return home</a></p>
    </div>
  </body>
</html>
